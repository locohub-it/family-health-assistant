{% extends "base.html" %}
{% block title %}Password{% endblock %}
{% block content %}
<h1>Password del pannello</h1>
<form method="post" action="/password" class="card">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="current">Password attuale</label>
  <input id="current" name="current" type="password" autocomplete="current-password" required>
  <label for="new">Nuova password</label>
  <input id="new" name="new" type="password" autocomplete="new-password" minlength="10" required>
  <label for="confirm">Ripeti la nuova password</label>
  <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="10" required>
  <div class="actions"><button class="primary">Aggiorna</button></div>
</form>
{% endblock %}
