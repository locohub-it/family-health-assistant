<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accesso · Family Health</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; font:15px/1.5 system-ui, sans-serif; background:#f6f7f9; color:#1d2330; }
  @media (prefers-color-scheme: dark) { body { background:#0f1115; color:#e6e8ec; } form { background:#181b22 !important; border-color:#2a2f3a !important; } input { background:#0f1115 !important; color:inherit; border-color:#2a2f3a !important; } }
  form { width:100%; max-width:340px; background:#fff; border:1px solid #e4e7ec; border-radius:12px; padding:24px; }
  h1 { font-size:20px; margin:0 0 16px; }
  label { display:block; font-weight:600; margin:12px 0 4px; }
  input { width:100%; box-sizing:border-box; padding:9px 10px; border:1px solid #e4e7ec; border-radius:6px; font:inherit; }
  button { width:100%; margin-top:18px; padding:10px; border:0; border-radius:6px; background:#2563eb; color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  .error { color:#b42318; margin:0 0 8px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>🩺 Family Health</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label for="username">Utente</label>
  <input id="username" name="username" type="text" autocomplete="username" required autofocus>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button>Accedi</button>
</form>
</body>
</html>
